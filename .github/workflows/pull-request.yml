name: Pull Request Checks

on:
  pull_request:

jobs:
  checks:
    name: Lint, Migrations, and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: djangoshipfast
      COMPOSE_FILE: docker-compose.yml:.github/compose.ci.yml

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Environment
        id: environment
        run: cp .env.example .env

      - name: Run Ruff Format Check
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Web Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-local
          load: true
          tags: djangoshipfast-web:latest
          cache-from: type=gha,scope=djangoshipfast-web
          cache-to: type=gha,scope=djangoshipfast-web,mode=max

      - name: Start Check Services
        run: docker compose up -d --wait --no-build web

      - name: Run Pylint
        run: docker compose exec -T web pylint core apps tests

      - name: Run djhtml
        run: docker compose exec -T web djhtml templates --check

      - name: Check for Missing Migrations
        run: docker compose exec -T web python manage.py makemigrations --dry-run --check

      - name: Run Tests with Coverage
        run: docker compose exec -T web pytest -n auto --cov=apps --cov-report=json --cov-report=term-missing --cov-fail-under=100

      - name: Upload Code Coverage
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          flags: unittests
          files: coverage.json

      - name: Stop Check Services
        if: always() && steps.environment.outcome == 'success'
        run: docker compose down
